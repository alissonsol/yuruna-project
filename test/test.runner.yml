# Per-cycle runner definition. The runner reads this at cycle start
# to know which top-level sequences to run continuously, one cycle after
# another.

# See https://yuruna.link/42e220c4-0009
sequences:
  - workload.guest.windows.11
  - workload.guest.ubuntu.server.26.k8s.website

# See https://yuruna.link/42e220c4-0009
testSets:
  - name: smoke
    displayName: Quick smoke test
    displayNameLocalized:
      pt-BR: Teste rapido
    description: Website only -- the fastest signal that the lab is healthy.
    descriptionLocalized:
      pt-BR: Apenas o site -- o sinal mais rapido de que o laboratorio esta saudavel.
    sequences:
      - ch01.website.example.no-break
  - name: windows
    displayName: Windows guest
    description: Windows 11 guest workload on its own.
    sequences:
      - workload.guest.windows.11
  - name: kubernetes
    displayName: Kubernetes website
    description: Ubuntu server 26 k8s website workload.
    sequences:
      - workload.guest.ubuntu.server.26.k8s.website
  - name: kubernetes-24
    displayName: Kubernetes website (24.04)
    description: The same website workload on the older Ubuntu server guest.
    sequences:
      - workload.guest.ubuntu.server.24.k8s.website
  - name: kubernetes-warm
    displayName: Kubernetes website (warm baseline)
    description: Restore a managed Ubuntu 26 Kubernetes baseline and test the website; rebuild after source changes or 24 hours.
    sequences:
      - website.ubuntu26.warm
  - name: kubernetes-24-warm
    displayName: Kubernetes website (24.04 warm baseline)
    description: Restore a managed Ubuntu 24 Kubernetes baseline and test the website; rebuild after source changes or 24 hours.
    sequences:
      - website.ubuntu24.warm
  - name: kubernetes-ssh
    displayName: Kubernetes website (SSH full install)
    description: Full Ubuntu 26 installation with the website workload over SSH, for comparison with the console lane.
    sequences:
      - workload.guest.ubuntu.server.26.k8s.website.ssh
  - name: kubernetes-24-ssh
    displayName: Kubernetes website (24.04 SSH full install)
    description: Full Ubuntu 24 installation with the website workload over SSH, for comparison with the console lane.
    sequences:
      - workload.guest.ubuntu.server.24.k8s.website.ssh
