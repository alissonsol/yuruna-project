# Per-cycle runner definition. The runner reads this at cycle start
# to know which top-level sequences to run continuously, one cycle after
# another.

# See https://yuruna.link/42e220c4-0009
sequences:
  - workload.guest.windows.11
  - workload.guest.ubuntu.server.26.k8s.website

# See https://yuruna.link/42e220c4-0009
testSets:
  - name: smoke
    displayName: Quick smoke test
    displayNameLocalized:
      pt-BR: Teste rapido
      zh-CN: "快速冒烟测试"
      he-IL: "בדיקת תקינות בסיסית מהירה"
    description: Website only -- the fastest signal that the lab is healthy.
    descriptionLocalized:
      pt-BR: Apenas o site -- o sinal mais rapido de que o laboratorio esta saudavel.
      zh-CN: "仅测试网站——最快确认实验室运行正常。"
      he-IL: "אתר בלבד — הסימן המהיר ביותר לכך שהמעבדה תקינה."
    sequences:
      - ch01.website.example.no-break
  - name: windows
    displayName: Windows guest
    displayNameLocalized:
      pt-BR: "Convidado para as janelas"
      zh-CN: "Windows客户机"
      he-IL: "אורח Windows"
    description: Windows 11 guest workload on its own.
    descriptionLocalized:
      pt-BR: "A carga de trabalho dos hóspedes do Windows 11 por conta própria."
      zh-CN: "单独运行的Windows 11客户机工作负载。"
      he-IL: "עומס עבודה של אורח Windows 11 בלבד."
    sequences:
      - workload.guest.windows.11
  - name: kubernetes
    displayName: Kubernetes website
    displayNameLocalized:
      pt-BR: "Página Web do Kubernetes"
      zh-CN: "Kubernetes网站"
      he-IL: "אתר Kubernetes"
    description: Ubuntu server 26 k8s website workload.
    descriptionLocalized:
      pt-BR: "Servidor Ubuntu 26 k8s carga de trabalho do site."
      zh-CN: "Ubuntu服务器26 k8s网站工作负载。"
      he-IL: "עומס עבודה של אתר ב-k8s בשרת Ubuntu 26."
    sequences:
      - workload.guest.ubuntu.server.26.k8s.website
  - name: kubernetes-24
    displayName: Kubernetes website (24.04)
    displayNameLocalized:
      pt-BR: "Sítio Web do Kubernetes (24.04)"
      zh-CN: "Kubernetes网站（24.04）"
      he-IL: "אתר על Kubernetes (⁦24.04⁩)"
    description: The same website workload on the older Ubuntu server guest.
    descriptionLocalized:
      pt-BR: "A mesma carga de trabalho do site no antigo hóspede do servidor Ubuntu."
      zh-CN: "在较旧版本的Ubuntu服务器客户机上运行相同的网站工作负载。"
      he-IL: "אותו עומס עבודה של האתר באורח עם גרסה ישנה יותר של שרת Ubuntu."
    sequences:
      - workload.guest.ubuntu.server.24.k8s.website
  - name: kubernetes-warm
    displayName: Kubernetes website (warm baseline)
    displayNameLocalized:
      pt-BR: "Página Web do Kubernetes (base inicial quente)"
      zh-CN: "Kubernetes网站（预热基线）"
      he-IL: "אתר על Kubernetes (תצורת בסיס מוכנה לשימוש)"
    description: Restore a managed Ubuntu 26 Kubernetes baseline and test the website; rebuild after source changes or 24 hours.
    descriptionLocalized:
      pt-BR: "Restaure uma linha de base gerenciada do Ubuntu 26 Kubernetes e teste o site; reconstrua após alterações de fonte ou 24 horas."
      zh-CN: "恢复受管Ubuntu 26 Kubernetes基线并测试网站；在源代码变更或24小时后重新构建。"
      he-IL: "שחזרו תצורת בסיס מנוהלת של Kubernetes על Ubuntu 26 ובדקו את האתר; בנו מחדש לאחר שינויים בקוד המקור או 24 שעות."
    sequences:
      - website.ubuntu26.warm
  - name: kubernetes-24-warm
    displayName: Kubernetes website (24.04 warm baseline)
    displayNameLocalized:
      pt-BR: "Kubernetes website (24.04 linha de base quente)"
      zh-CN: "Kubernetes网站（24.04预热基线）"
      he-IL: "אתר על Kubernetes (⁦24.04⁩ תצורת בסיס מוכנה לשימוש)"
    description: Restore a managed Ubuntu 24 Kubernetes baseline and test the website; rebuild after source changes or 24 hours.
    descriptionLocalized:
      pt-BR: "Restaure uma linha de base gerenciada do Ubuntu 24 Kubernetes e teste o site; reconstrua após alterações de fonte ou 24 horas."
      zh-CN: "恢复受管Ubuntu 24 Kubernetes基线并测试网站；在源代码变更或24小时后重新构建。"
      he-IL: "שחזרו תצורת בסיס מנוהלת של Kubernetes על Ubuntu 24 ובדקו את האתר; בנו מחדש לאחר שינויים בקוד המקור או 24 שעות."
    sequences:
      - website.ubuntu24.warm
  - name: kubernetes-ssh
    displayName: Kubernetes website (SSH full install)
    displayNameLocalized:
      pt-BR: "Página Web do Kubernetes (instalação completa do SHS)"
      zh-CN: "Kubernetes网站（SSH完整安装）"
      he-IL: "אתר על Kubernetes (התקנה מלאה דרך SSH)"
    description: Full Ubuntu 26 installation with the website workload over SSH, for comparison with the console lane.
    descriptionLocalized:
      pt-BR: "Instalação completa do Ubuntu 26 com a carga de trabalho do site sobre o SSH, para comparação com a pista de console."
      zh-CN: "通过SSH完整安装Ubuntu 26及网站工作负载，用于与控制台测试流程进行比较。"
      he-IL: "התקנה מלאה של Ubuntu 26 עם עומס העבודה של האתר דרך SSH, להשוואה עם מסלול המסוף."
    sequences:
      - workload.guest.ubuntu.server.26.k8s.website.ssh
  - name: kubernetes-24-ssh
    displayName: Kubernetes website (24.04 SSH full install)
    displayNameLocalized:
      pt-BR: "Página Web do Kubernetes (24.04 SSH full install)"
      zh-CN: "Kubernetes网站（24.04 SSH完整安装）"
      he-IL: "אתר על Kubernetes (⁦24.04⁩ התקנה מלאה דרך SSH)"
    description: Full Ubuntu 24 installation with the website workload over SSH, for comparison with the console lane.
    descriptionLocalized:
      pt-BR: "Instalação completa do Ubuntu 24 com a carga de trabalho do site sobre o SSH, para comparação com a pista de console."
      zh-CN: "通过SSH完整安装Ubuntu 24及网站工作负载，用于与控制台测试流程进行比较。"
      he-IL: "התקנה מלאה של Ubuntu 24 עם עומס העבודה של האתר דרך SSH, להשוואה עם מסלול המסוף."
    sequences:
      - workload.guest.ubuntu.server.24.k8s.website.ssh
