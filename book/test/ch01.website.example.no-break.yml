sequenceGuid: 42001283-d9e8-4f13-a78e-5c5f2206926e
sequenceRevision: 2

description: "Amazon Linux 2023 used for simple access to a website"
descriptionLocalized:
  pt-BR: "Amazon Linux 2023 usado para um acesso simples a um site"
  zh-CN: "使用Amazon Linux 2023简单访问一个网站"
  he-IL: "Amazon Linux ⁦2023⁩ משמש לגישה פשוטה לאתר אינטרנט"
keystrokeMechanism: gui

# --- REGION: resource
resource:
  amazon.linux.2023:
    - start.guest.amazon.linux.2023
variables:
  username: ch01user1
  hostname: ch01host1

# --- REGION: component
component:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    descriptionLocalized:
      pt-BR: "Login + tentar novamente"
      zh-CN: "登录并重试"
      he-IL: "התחברות + ניסיון חוזר"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"
        descriptionLocalized:
          pt-BR: "OCR: login:"
          zh-CN: "光学字符识别：login:"
          he-IL: "זיהוי תווים אופטי: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"
        descriptionLocalized:
          pt-BR: "OCR: Senha:"
          zh-CN: "光学字符识别：Password:"
          he-IL: "זיהוי תווים אופטי: Password:"

  - action: waitForText
    pattern: "${username}@${hostname}"
    noSegmentMatch: true
    timeoutSeconds: 90
    description: "OCR: ${username}@${hostname}"
    descriptionLocalized:
      pt-BR: "OCR: ${username}@${hostname}"
      zh-CN: "光学字符识别：${username}@${hostname}"
      he-IL: "זיהוי תווים אופטי: ${username}@${hostname}"

  - snippet: shellInputPrime

# --- REGION: workload
workload:
  - action: fetchAndExecute
    text: "curl -so /dev/null -w '\\nReturn code: %{http_code}\\n\\n' example.com"
    description: "curl example.com"
    descriptionLocalized:
      pt-BR: "curl example.com"
      zh-CN: "curl example.com"
      he-IL: "⁦curl example.com⁩"
    waitPattern: "200"

  - action: networkRelease
    description: "Release network resources"
    descriptionLocalized:
      pt-BR: "Lançar recursos de rede"
      zh-CN: "释放网络资源"
      he-IL: "שחררו את משאבי הרשת"
