sequenceGuid: 42001283-d9e8-4f14-a78e-5c5f2206926f
sequenceRevision: 3

description: "Ubuntu Server 24.04 (book ch02, unattended): log in, install Kubernetes, deploy website to localhost cluster, verify HTTP 200."
keystrokeMechanism: gui
# --- REGION: resource
resource:
  ubuntu.server.24:
    # The chapter's .NET application is built inside Docker. Chaining the
    # Code workload would install a JDK, .NET SDK, and VS Code on the guest,
    # none of which this scenario uses.
    - start.guest.ubuntu.server.24
variables:
  username: ch02user2
  hostname: ch02host2

# --- REGION: component
component:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      # start.guest reboots at the end; prime the console before logging in.
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@${hostname}"
    timeoutSeconds: 90
    description: "OCR: ${username}@${hostname}"

# --- REGION: workload
workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.k8s.sh"
    description: "ubuntu.server.24.k8s.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  # `&&`, not `;`: the node table must be reachable ONLY when the wait
  # actually succeeded, so that seeing the table is itself proof of readiness.
  - action: inputTextAndEnter
    text: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && clear && kubectl get nodes"
    description: "Check node status"

  # See https://yuruna.link/42e220c4-0009
  - action: waitForText
    pattern: "control-plane"
    timeoutSeconds: 360
    description: "OCR: control-plane"

  - action: inputTextAndEnter
    text: "clear; newgrp docker"
    description: "Activate docker group"

  # See https://yuruna.link/42e220c4-0009
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/example/website/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.website.sh"
    description: "ubuntu.server.24.workload.k8s.website.sh"
    waitPattern: "FETCHED AND EXECUTED:"
    freshMatchTailLines: 60
    timeoutSeconds: 1200

  - action: fetchAndExecute
    text: "clear; /usr/local/lib/yuruna/fetch-and-execute.sh test/test-localhost.sh"
    description: "test-localhost.sh"
    waitPattern: "200 OK"

  - action: saveSystemDiagnostic
    id: k8s.website
    description: "Capture diagnostics"

  - action: networkRelease
    description: "Release network resources"
