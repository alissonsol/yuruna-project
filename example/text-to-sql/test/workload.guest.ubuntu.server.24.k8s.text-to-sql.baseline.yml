sequenceGuid: 426ca572-7dda-4e43-be71-93462c7ef6e7
sequenceRevision: 3

description: "Ubuntu Server 24.04: log in, install Kubernetes, prepare for text-to-sql deployment."
descriptionLocalized:
  pt-BR: "Servidor Ubuntu 24.04: faça login, instale Kubernetes, prepare-se para implantação de texto para sql."
  zh-CN: "Ubuntu Server 24.04：登录，安装Kubernetes，为部署text-to-sql做好准备。"
  he-IL: "Ubuntu Server ⁦24.04⁩: התחברו, התקינו Kubernetes והתכוננו לפריסת text-to-sql."
keystrokeMechanism: gui
# Chain start.guest directly. The workload.guest chain
# additionally installs a JDK, .NET SDK, and VS Code
# (ubuntu.server.24.code.sh), which text-to-sql does not use and only adds
# install time + failure surface to an unattended cycle. update.sh already
# leaves pwsh + the framework/project repos in place.
# --- REGION: resource
resource:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: yt2sqluser
  hostname: yt2sqlhost

# --- REGION: component
component:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    descriptionLocalized:
      pt-BR: "Login + tentar novamente"
      zh-CN: "登录并重试"
      he-IL: "התחברות + ניסיון חוזר"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"
        descriptionLocalized:
          pt-BR: "OCR: login:"
          zh-CN: "光学字符识别：login:"
          he-IL: "זיהוי תווים אופטי: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"
        descriptionLocalized:
          pt-BR: "OCR: Senha:"
          zh-CN: "光学字符识别：Password:"
          he-IL: "זיהוי תווים אופטי: Password:"

  - action: waitForText
    pattern: "${username}@${hostname}"
    timeoutSeconds: 90
    description: "OCR: ${username}@${hostname}"
    descriptionLocalized:
      pt-BR: "OCR: ${username}@${hostname}"
      zh-CN: "光学字符识别：${username}@${hostname}"
      he-IL: "זיהוי תווים אופטי: ${username}@${hostname}"

# --- REGION: workload
workload:
  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.k8s.sh"
    description: "ubuntu.server.24.k8s.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.24.k8s.sh"
      zh-CN: "ubuntu.server.24.k8s.sh"
      he-IL: "⁦ubuntu.server.24.k8s.sh⁩"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3000

  # `&&`, not `;`: the node table must be reachable ONLY when the wait
  # actually succeeded, so that seeing the table is itself proof of readiness.
  - action: inputTextAndEnter
    text: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && clear && kubectl get nodes"
    description: "Check node status"
    descriptionLocalized:
      pt-BR: "Verificar o estado do nó"
      zh-CN: "检查节点状态"
      he-IL: "בדקו את מצב הצומת"

  # See https://yuruna.link/42e220c4-0009
  - action: waitForText
    pattern: "control-plane"
    timeoutSeconds: 360
    description: "OCR: control-plane"
    descriptionLocalized:
      pt-BR: "OCR: plano de controlo"
      zh-CN: "光学字符识别：control-plane"
      he-IL: "זיהוי תווים אופטי: control-plane"

  - action: inputTextAndEnter
    text: "clear; newgrp docker"
    description: "Activate docker group"
    descriptionLocalized:
      pt-BR: "Ativar grupo de docker"
      zh-CN: "激活docker组"
      he-IL: "הפעילו את קבוצת docker"

  - action: saveDiskSnapshot
    id: "k8s.text-to-sql"
    description: "Snapshot before Postgres in text-to-sql workload"
    descriptionLocalized:
      pt-BR: "Imagem antes do Postgres na carga de trabalho texto- para- sql"
      zh-CN: "在text-to-sql工作负载的Postgres步骤之前创建快照"
      he-IL: "צרו תמונת מצב לפני Postgres בעומס העבודה text-to-sql"
