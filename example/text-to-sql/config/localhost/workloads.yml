# Workloads information - localhost
---
# --- REGION: globalVariables
globalVariables:
  # TO-SET: set domain below, like yrn42.com
  # appDomain:             "yrn42text2sql-domain"
  appDomain:             "yrn42.com"
  # TO-SET: set site address below, like www.yrn42.com
  # appHost:               "www.yrn42text2sql-domain"
  # see: https://letsencrypt.org/docs/certificates-for-localhost/
  appHost:               "localhost"
  appTlsSecret:          "text-to-sql-ui-tls-secret"
  # Secret holding the pod's HTTPS certificate and its generated password; created
  # by create-cert-secret.ps1 below and mounted by the chart.
  appPodCertSecret:      "text-to-sql-ui-pod-cert"
  # Secret holding the read-only database role's password; created by
  # create-db-secret.ps1 below from the file the database setup step writes, and
  # read by the pod through secretKeyRef.
  appDbSecret:           "text-to-sql-db"
  certManagerIssuerEmail: "certificates@yrn42.com"
  _registryLocation:     "$($([Environment]::GetEnvironmentVariable(\"${env:registryName}.registryLocation\")) -replace '.azurecr.io','')"
  dockerServer:          "http://${env:_registryLocation}"
  dockerUsername:        "placeholder"
  dockerPassword:        "placeholder"
  ingressClass:          "nginx"

# --- REGION: workloads
workloads:
- context: "${env:runTag}-${env:project}-${env:runId}"
  variables:
    _hostname: "$([Environment]::GetEnvironmentVariable(\"${env:contextName}.hostname\"))"
    _frontendIp: "$([Environment]::GetEnvironmentVariable(\"${env:contextName}.frontendIp\"))"
    tls-crt: "$(Join-Path -Path ${env:workFolder} -ChildPath \"text-to-sql-ui-tls.crt\")"
    tls-key: "$(Join-Path -Path ${env:workFolder} -ChildPath \"text-to-sql-ui-tls.key\")"
  deployments:
    # Uninstall previous workloads: idempotent
    - kubectl: "delete namespace ${env:namespace} --ignore-not-found=true --v=1"
    - kubectl: "delete namespace ingress-ns --ignore-not-found=true --v=1"
    # See https://yuruna.link/42e220c4-0009
    - kubectl: "delete namespace cert-manager --ignore-not-found=true --v=1"
    - kubectl: "delete crd,clusterrole,clusterrolebinding,validatingwebhookconfiguration,mutatingwebhookconfiguration --selector app.kubernetes.io/instance=cert-manager --ignore-not-found=true --v=1"
    - kubectl: "delete role,rolebinding --namespace kube-system --selector app.kubernetes.io/instance=cert-manager --ignore-not-found=true --v=1"
    - kubectl: "delete clusterrole nginx-ingress-ingress-nginx --ignore-not-found=true"
    - kubectl: "delete clusterrolebinding nginx-ingress-ingress-nginx --ignore-not-found=true"
    # Install dependencies
    - kubectl: "create namespace ${env:namespace} --v=1"
    - kubectl: "config set-context --current --namespace=${env:namespace} --v=1"
    # For localhost: manually create certificate
    # On Linux, run mkcert -install as the logged-in user (honoring SUDO_USER)
    # so rootCA.pem lands in that user's $HOME/.local/share/mkcert.
    - shell: 'if ("$IsLinux" -eq "True") { sudo -u (`$(if (`$env:SUDO_USER) { `$env:SUDO_USER } else { `$env:USER })) -H mkcert -install } else { mkcert -install }'
    - shell: "mkcert -key-file \"${env:tls-key}\" -cert-file \"${env:tls-crt}\" ${env:appDomain} \"*.${env:appDomain}\" localhost \"*.localhost\" 127.0.0.1 ::1 ${env:_hostname} ${env:_frontendIp}"
    - kubectl: "delete secret ${env:appTlsSecret} --namespace=${env:namespace} --ignore-not-found=true"
    - kubectl: "create secret tls ${env:appTlsSecret} --key \"${env:tls-key}\" --cert \"${env:tls-crt}\" --namespace=${env:namespace}"
    # Ingress
    - helm: "repo add ingress-nginx https://kubernetes.github.io/ingress-nginx"
    - helm: "repo update"
    - helm: >
        install nginx-ingress ingress-nginx/ingress-nginx
        --namespace ingress-ns
        --create-namespace
        --set controller.replicaCount=1
        --set controller.nodeSelector."kubernetes\.io/os"=linux
        --set controller.hostPort.enabled=true
        --set controller.service.type=ClusterIP
        --set controller.admissionWebhooks.enabled=false
        --set controller.ingressClass=${env:ingressClass}
    # Install components
    - kubectl: "config set-context --current --namespace=${env:namespace} --v=1"
    - kubectl: "create secret docker-registry registry-credential --docker-server=${env:dockerServer} --docker-username=${env:dockerUsername} --docker-password=${env:dockerPassword}"
    # The pod needs this Secret to start, so it precedes the chart. The password is generated
    # inside the script and never passes through a variable, a command line or a log.
    - shell: "& '${env:project_root}/components/frontend/text-to-sql-ui/create-cert-secret.ps1' -Namespace ${env:namespace} -SecretName ${env:appPodCertSecret}"
    # Same ordering and secrecy rules for the database password: the script reads the
    # owner-only file that the database setup step wrote and sends the Secret to kubectl
    # on standard input.
    - shell: "& '${env:project_root}/components/frontend/text-to-sql-ui/create-db-secret.ps1' -Namespace ${env:namespace} -SecretName ${env:appDbSecret}"
    - chart: "frontend/text-to-sql-ui"
      variables:
        installName: "text-to-sql-ui-${env:runId}"
    - shell: 'Write-Information ">> Endpoint: https://${env:appHost}"'
    - shell: 'Write-Information "-- Check containers started: kubectl get pods --all-namespaces"'
    - shell: 'Write-Information "-- Check services: kubectl get svc --all-namespaces"'
    - shell: 'Write-Information ">>    Test: curl -k -v http://${env:appHost}"'
    - shell: 'Write-Information ">>    Check usage of ports like 80 and 443 (Quit/starting Docker may resolve; not the menu item Restart!)"'
