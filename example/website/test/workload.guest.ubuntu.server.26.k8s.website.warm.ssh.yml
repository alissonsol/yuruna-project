sequenceGuid: 425b9d12-45f9-4dbc-aa2c-d862daf76235
sequenceRevision: 1

description: "Ubuntu Server 26.04 (SSH): restore the Kubernetes baseline, deploy the website, and verify HTTP 200."
descriptionLocalized:
  pt-BR: "Ubuntu Server 26.04 (SSH): restaurar a linha de base do Kubernetes, implantar o site e verificar HTTP 200."
  zh-CN: "Ubuntu Server 26.04（SSH）：恢复Kubernetes基线，部署网站并验证HTTP 200。"
  he-IL: "Ubuntu Server ⁦26.04⁩ (SSH): שחזרו את תצורת הבסיס של Kubernetes, פרסו את האתר וודאו שמתקבל HTTP 200."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.26:
    - workload.guest.ubuntu.server.26.k8s.website.baseline.ssh
requiresSnapshot:
  id: website-ubuntu26-k8s
snapshotPolicy:
  maxAgeHours: 24
  rebuildOnMismatch: true
  sourceFiles:
    - guest/ubuntu.server.26/*.sh
    - host/*/guest.ubuntu.server.26/*.ps1
    - host/modules/Yuruna.UbuntuImage.psm1
    - host/vmconfig/ubuntu.server.*
    - automation/fetch-and-execute.sh
    - automation/yuruna-retry.sh
    - automation/yuruna-versions.sh
    - test/sequences/start.guest.ubuntu.server.26*.yml
    - project/example/website/test/workload.guest.ubuntu.server.26.k8s.website.baseline.ssh.yml
variables:
  username: yuwebsite26
  hostname: yuwebsite26

# --- REGION: component
component:
  - action: loadDiskSnapshot
    id: website-ubuntu26-k8s
    description: "Restore the managed Kubernetes baseline"
    descriptionLocalized:
      pt-BR: "Restaurar a linha de base gerenciada do Kubernetes"
      zh-CN: "恢复受管Kubernetes基线"
      he-IL: "שחזרו את תצורת הבסיס המנוהלת של Kubernetes"

  - action: sshWaitReady
    timeoutSeconds: 600
    description: "Wait for sshd after restoring the baseline"
    descriptionLocalized:
      pt-BR: "Aguarde pelo sshd após restaurar a linha de base"
      zh-CN: "恢复基线后等待sshd就绪"
      he-IL: "המתינו ל-sshd לאחר שחזור תצורת הבסיס"

  - action: sshExec
    command: 'mkdir -p "$HOME/.kube" && sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" /etc/kubernetes/admin.conf "$HOME/.kube/config" && kubectl wait --for=condition=Ready nodes --all --timeout=300s && sudo kubeadm certs check-expiration'
    timeoutSeconds: 360
    description: "Refresh the client configuration and verify the restored cluster"
    descriptionLocalized:
      pt-BR: "Atualizar a configuração do cliente e verificar o cluster restaurado"
      zh-CN: "刷新客户端配置并验证恢复后的集群"
      he-IL: "רעננו את תצורת הלקוח וודאו את תקינות האשכול ששוחזר"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/example/website/test/ubuntu.server.26/ubuntu.server.26.workload.k8s.website.sh"
    timeoutSeconds: 1800
    description: "ubuntu.server.26.workload.k8s.website.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.26.workload.k8s.website.sh"
      zh-CN: "ubuntu.server.26.workload.k8s.website.sh"
      he-IL: "⁦ubuntu.server.26.workload.k8s.website.sh⁩"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh test/test-localhost.sh"
    timeoutSeconds: 240
    description: "Verify HTTP 200"
    descriptionLocalized:
      pt-BR: "Verificar HTTP 200"
      zh-CN: "验证HTTP 200"
      he-IL: "ודאו שמתקבל HTTP 200"

  - action: saveSystemDiagnostic
    id: k8s.website.warm
    description: "Capture diagnostics"
    descriptionLocalized:
      pt-BR: "Capturar diagnósticos"
      zh-CN: "收集诊断信息"
      he-IL: "אספו נתוני אבחון"
