sequenceGuid: 42272942-dcd0-48fc-ba88-814462c89f5a
sequenceRevision: 4

description: "Ubuntu Server 26.04 (SSH): install Kubernetes, deploy website to localhost cluster, verify HTTP 200."
descriptionLocalized:
  pt-BR: "Servidor Ubuntu 26.04 (SSH): instale o Kubernetes, implante o site no cluster localhost, verifique HTTP 200."
  zh-CN: "Ubuntu Server 26.04（SSH）：安装Kubernetes，将网站部署到localhost集群，验证HTTP 200。"
  he-IL: "Ubuntu Server ⁦26.04⁩ (SSH): התקינו את Kubernetes, פרסו את האתר באשכול localhost וודאו שמתקבל HTTP 200."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.26:
    # The website builds its .NET application inside Docker. Chaining the
    # Code workload would install a JDK, .NET SDK, and VS Code on the guest,
    # none of which this scenario uses.
    - start.guest.ubuntu.server.26.ssh
variables:
  username: yuuser26
  hostname: yuhost26

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "Wait for sshd after reboot"
    descriptionLocalized:
      pt-BR: "Aguarde pelo sshd após reiniciar"
      zh-CN: "重启后等待sshd就绪"
      he-IL: "המתינו ל-sshd לאחר ההפעלה מחדש"

  - action: sshExec
    command: "whoami && hostname"
    description: "Smoke test: whoami/hostname"
    descriptionLocalized:
      pt-BR: "Teste de fumo: whoami/nome da máquina"
      zh-CN: "冒烟测试：whoami/hostname"
      he-IL: "בדיקת תקינות ראשונית: whoami⁦/hostname⁩"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.k8s.sh"
    timeoutSeconds: 3000
    description: "ubuntu.server.26.k8s.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.26.k8s.sh"
      zh-CN: "ubuntu.server.26.k8s.sh"
      he-IL: "⁦ubuntu.server.26.k8s.sh⁩"

  - action: sshExec
    command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && kubectl get nodes"
    timeoutSeconds: 360
    description: "Wait for every node Ready"
    descriptionLocalized:
      pt-BR: "Aguarde por cada nó pronto"
      zh-CN: "等待所有节点进入Ready状态"
      he-IL: "המתינו עד שכל הצמתים יהיו במצב Ready"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/example/website/test/ubuntu.server.26/ubuntu.server.26.workload.k8s.website.sh"
    timeoutSeconds: 1800
    description: "ubuntu.server.26.workload.k8s.website.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.26.workload.k8s.website.sh"
      zh-CN: "ubuntu.server.26.workload.k8s.website.sh"
      he-IL: "⁦ubuntu.server.26.workload.k8s.website.sh⁩"

  - action: sshExec
    command: "bash /home/${username}/yuruna/test/test-localhost.sh 2>&1 | tee /tmp/test-localhost.out; grep -q 200 /tmp/test-localhost.out"
    timeoutSeconds: 120
    description: "Check HTTP 200 in test output"
    descriptionLocalized:
      pt-BR: "Verificar HTTP 200 na saída de teste"
      zh-CN: "检查测试输出中的HTTP 200"
      he-IL: "בדקו שמופיע HTTP 200 בפלט הבדיקה"
