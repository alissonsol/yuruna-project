sequenceGuid: 42a558c0-d2af-42a3-a8f2-6909dde087c4
sequenceRevision: 3

description: "Ubuntu Server 24.04 (SSH): install Kubernetes, deploy website to localhost cluster, verify HTTP 200."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.24:
    # The website builds its .NET application inside Docker. Chaining the
    # Code workload would install a JDK, .NET SDK, and VS Code on the guest,
    # none of which this scenario uses.
    - start.guest.ubuntu.server.24.ssh
variables:
  username: yuuser24
  hostname: yuhost24

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "Wait for sshd after reboot"

  - action: sshExec
    command: "whoami && hostname"
    description: "Smoke test: whoami/hostname"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.k8s.sh"
    timeoutSeconds: 1800
    description: "ubuntu.server.24.k8s.sh"

  - action: sshExec
    command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && kubectl get nodes"
    timeoutSeconds: 360
    description: "Wait for every node Ready"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/example/website/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.website.sh"
    timeoutSeconds: 1800
    description: "ubuntu.server.24.workload.k8s.website.sh"

  - action: sshExec
    command: "bash /home/${username}/yuruna/test/test-localhost.sh 2>&1 | tee /tmp/test-localhost.out; grep -q 200 /tmp/test-localhost.out"
    timeoutSeconds: 120
    description: "Check HTTP 200 in test output"
