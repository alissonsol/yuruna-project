sequenceGuid: 42da5179-0a82-42cd-829d-dc45be49f808
sequenceRevision: 2

description: "Ubuntu Server 24.04 (SSH): build a managed Kubernetes baseline for the website."
descriptionLocalized:
  pt-BR: "Ubuntu Server 24.04 (SSH): crie uma linha de base gerenciada do Kubernetes para o site."
  zh-CN: "Ubuntu Server 24.04（SSH）：为网站构建托管Kubernetes基线。"
  he-IL: "Ubuntu Server ⁦24.04⁩ (SSH): בנו מצב בסיס מנוהל של Kubernetes עבור אתר האינטרנט."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24.ssh
snapshotPolicy:
  maxAgeHours: 24
  rebuildOnMismatch: true
  sourceFiles:
    - guest/ubuntu.server.24/*.sh
    - host/*/guest.ubuntu.server.24/*.ps1
    - host/modules/Yuruna.UbuntuImage.psm1
    - host/vmconfig/ubuntu.server.*
    - automation/fetch-and-execute.sh
    - automation/yuruna-retry.sh
    - automation/yuruna-versions.sh
    - test/sequences/start.guest.ubuntu.server.24*.yml
    - project/example/website/test/workload.guest.ubuntu.server.24.k8s.website.baseline.ssh.yml
variables:
  username: yuwebsite24
  hostname: yuwebsite24

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "Wait for sshd after reboot"
    descriptionLocalized:
      pt-BR: "Aguarde pelo sshd após reiniciar"
      zh-CN: "重启后等待sshd就绪"
      he-IL: "המתינו ל-sshd לאחר האתחול מחדש"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.k8s.sh"
    timeoutSeconds: 3000
    description: "ubuntu.server.24.k8s.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.24.k8s.sh"
      zh-CN: "ubuntu.server.24.k8s.sh"
      he-IL: "⁦ubuntu.server.24.k8s.sh⁩"

  - action: sshExec
    command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && sudo kubeadm certs check-expiration"
    timeoutSeconds: 360
    description: "Verify Kubernetes and certificate validity before saving"
    descriptionLocalized:
      pt-BR: "Verificar a validade do Kubernetes e do certificado antes de gravar"
      zh-CN: "保存前验证Kubernetes和证书有效性"
      he-IL: "בדקו את תקינות Kubernetes ואת תוקף התעודה לפני השמירה"

  - action: saveDiskSnapshot
    id: website-ubuntu24-k8s
    description: "Save the managed Kubernetes baseline"
    descriptionLocalized:
      pt-BR: "Salvar a linha de base gerenciada do Kubernetes"
      zh-CN: "保存托管Kubernetes基线"
      he-IL: "שמרו את מצב הבסיס המנוהל של Kubernetes"
