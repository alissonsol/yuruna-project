sequenceGuid: 4207c826-8f03-45dc-b6ea-4de80820f492
sequenceRevision: 2

description: "Ubuntu Server 26.04 (SSH): build a managed Kubernetes baseline for the website."
descriptionLocalized:
  pt-BR: "Ubuntu Server 26.04 (SSH): crie uma linha de base gerenciada do Kubernetes para o site."
  zh-CN: "Ubuntu Server 26.04（SSH）：为网站构建受管Kubernetes基线。"
  he-IL: "Ubuntu Server ⁦26.04⁩ (SSH): בנו תצורת בסיס מנוהלת של Kubernetes עבור האתר."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.26:
    - start.guest.ubuntu.server.26.ssh
snapshotPolicy:
  maxAgeHours: 24
  rebuildOnMismatch: true
  sourceFiles:
    - guest/ubuntu.server.26/*.sh
    - host/*/guest.ubuntu.server.26/*.ps1
    - host/modules/Yuruna.UbuntuImage.psm1
    - host/vmconfig/ubuntu.server.*
    - automation/fetch-and-execute.sh
    - automation/yuruna-retry.sh
    - automation/yuruna-versions.sh
    - test/sequences/start.guest.ubuntu.server.26*.yml
    - project/example/website/test/workload.guest.ubuntu.server.26.k8s.website.baseline.ssh.yml
variables:
  username: yuwebsite26
  hostname: yuwebsite26

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "Wait for sshd after reboot"
    descriptionLocalized:
      pt-BR: "Aguarde pelo sshd após reiniciar"
      zh-CN: "重启后等待sshd就绪"
      he-IL: "המתינו ל-sshd לאחר ההפעלה מחדש"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.26/ubuntu.server.26.k8s.sh"
    timeoutSeconds: 3000
    description: "ubuntu.server.26.k8s.sh"
    descriptionLocalized:
      pt-BR: "ubuntu.server.26.k8s.sh"
      zh-CN: "ubuntu.server.26.k8s.sh"
      he-IL: "⁦ubuntu.server.26.k8s.sh⁩"

  - action: sshExec
    command: "kubectl wait --for=condition=Ready nodes --all --timeout=300s && sudo kubeadm certs check-expiration"
    timeoutSeconds: 360
    description: "Verify Kubernetes and certificate validity before saving"
    descriptionLocalized:
      pt-BR: "Verificar a validade do Kubernetes e do certificado antes de gravar"
      zh-CN: "保存前验证Kubernetes和证书的有效性"
      he-IL: "ודאו את תקינות Kubernetes ואת תוקף התעודה לפני השמירה"

  - action: saveDiskSnapshot
    id: website-ubuntu26-k8s
    description: "Save the managed Kubernetes baseline"
    descriptionLocalized:
      pt-BR: "Salvar a linha de base gerenciada do Kubernetes"
      zh-CN: "保存受管Kubernetes基线"
      he-IL: "שמרו את תצורת הבסיס המנוהלת של Kubernetes"
