# Requires the Secret website-pod-cert in the pod's namespace; create it with
# create-cert-secret.ps1 (see README.md).
apiVersion: v1
kind: Pod
metadata:
  name: website-pod
  labels:
    app: website-pod
spec:
  # The key is readable by its owner and group only; the .NET base images give their
  # non-root user and group the ID 1654.
  securityContext:
    fsGroup: 1654
  containers:
    - name: website-app
      image: "localhost:5000/website/website:latest"
      ports:
        - containerPort: 80
        - containerPort: 443
      env:
      - name: ASPNETCORE_URLS
        value: "https://+;http://+"
      - name: ASPNETCORE_HTTPS_PORT
        value: "8001"
      - name: ASPNETCORE_Kestrel__Certificates__Default__Password
        valueFrom:
          secretKeyRef:
            name: website-pod-cert
            key: password
      - name: ASPNETCORE_Kestrel__Certificates__Default__Path
        value: "/https/aspnetapp.pfx"
      volumeMounts:
        - name: pod-certificate
          mountPath: /https
          readOnly: true
  volumes:
    - name: pod-certificate
      secret:
        secretName: website-pod-cert
        defaultMode: 0440
        items:
          - key: aspnetapp.pfx
            path: aspnetapp.pfx
