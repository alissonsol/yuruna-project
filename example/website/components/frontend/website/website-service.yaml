apiVersion: v1
kind: Service
metadata:
  name: website-service
spec:
  selector:
    app: website-pod
  type: NodePort
  ports:
    - protocol: TCP
      name: tcp80
      port: 80
      targetPort: 80
      nodePort: 30080
    - protocol: TCP
      name: tcp443
      port: 443
      targetPort: 443
      nodePort: 30443
