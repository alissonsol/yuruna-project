apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
      - name: website
        # See https://yuruna.link/42010605-0005
        {{- $regKey := printf "%s.registryLocation" (required "Helm values is missing 'registryName'. Check that resources.yml globalVariables sets registryName and that yuruna resources / components / workloads all ran in the same project_root." .Values.registryName) }}
        {{- $reg := required (printf "Helm values is missing key %q. The registry's tofu output did not reach values.yaml. Check that config/<env>/resources.output.yml has a %s block with a registryLocation.value (run 'yuruna resources <project> <env>' to (re)create it) before running 'yuruna workloads'." $regKey .Values.registryName) (index .Values $regKey) }}
        {{- $certSecret := required "Helm values is missing 'websitePodCertSecret'. Check that config/<env>/workloads.yml globalVariables names the Secret that components/frontend/website/create-cert-secret.ps1 creates before the chart is installed." .Values.websitePodCertSecret }}
        image: {{ $reg }}/{{ required "Helm values is missing 'containerPrefix'." .Values.containerPrefix }}/website:latest
        imagePullPolicy: Always
        ports:
        - name: port80
          containerPort: 80
        - name: port443
          containerPort: 443
        # --- REGION: resources
        # See https://yuruna.link/42e220c4-0009
        resources:
          requests:
            ephemeral-storage: "256Mi"
            memory: "256Mi"
            cpu: "200m"
          limits:
            ephemeral-storage: "1Gi"
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: ASPNETCORE_URLS
          value: "https://+;http://+"
        - name: ASPNETCORE_HTTPS_PORT
          value: "443"
        # The certificate and its password live only in the Secret, which is created for
        # each deployment with a generated password (see the website component README).
        - name: ASPNETCORE_Kestrel__Certificates__Default__Password
          valueFrom:
            secretKeyRef:
              name: {{ $certSecret }}
              key: password
        - name: ASPNETCORE_Kestrel__Certificates__Default__Path
          value: "/https/aspnetapp.pfx"
        volumeMounts:
        - name: pod-certificate
          mountPath: /https
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        # Readiness alone cannot recover a process that comes up but never binds
        # the port: the pod stays 0/1 until the deploy's own wait expires, which
        # surfaces as a chart timeout rather than as the stuck container it is.
        # Liveness restarts it instead. The delay is generous next to the ~10s a
        # healthy start takes, so an ordinarily slow boot is never killed.
        livenessProbe:
          tcpSocket:
            port: 443
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
      imagePullSecrets:
        - name: registry-credential
      # The key is readable by its owner and group only. The .NET base images give their
      # non-root user and group the ID 1654, so the group lets that user read the key if the
      # image ever drops root; the process runs as root today and reads it either way.
      securityContext:
        fsGroup: 1654
      volumes:
      - name: pod-certificate
        secret:
          secretName: {{ $certSecret }}
          defaultMode: 0440
          items:
          - key: aspnetapp.pfx
            path: aspnetapp.pfx
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: {{ .Values.namespace }}
  labels:
    app: website
spec:
  type: NodePort
  ports:
    - name: port80
      port: 80
      targetPort: 80
      protocol: TCP
    - name: port443
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: website
