# --- REGION: apiVersion
apiVersion: apps/v1
kind: Deployment
# --- REGION: metadata
metadata:
  name: website
  namespace: {{ .Values.namespace }}
# --- REGION: spec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    # --- REGION: metadata
    metadata:
      labels:
        app: website
    # --- REGION: spec
    spec:
      # --- REGION: containers
      containers:
      - name: website
        # See https://yuruna.link/42010605-0005
        {{- $regKey := printf "%s.registryLocation" (required "Helm values is missing 'registryName'. Check that resources.yml globalVariables sets registryName and that yuruna resources / components / workloads all ran in the same project_root." .Values.registryName) }}
        {{- $reg := required (printf "Helm values is missing key %q. The registry's tofu output did not reach values.yaml. Check that config/<env>/resources.output.yml has a %s block with a registryLocation.value (run 'yuruna resources <project> <env>' to (re)create it) before running 'yuruna workloads'." $regKey .Values.registryName) (index .Values $regKey) }}
        {{- $certSecret := required "Helm values is missing 'websitePodCertSecret'. Check that config/<env>/workloads.yml globalVariables names the Secret that components/frontend/website/create-cert-secret.ps1 creates before the chart is installed." .Values.websitePodCertSecret }}
        image: {{ $reg }}/{{ required "Helm values is missing 'containerPrefix'." .Values.containerPrefix }}/website:latest
        imagePullPolicy: Always
        # --- REGION: ports
        ports:
        - name: port80
          containerPort: 80
        - name: port443
          containerPort: 443
        # --- REGION: resources
        # See https://yuruna.link/42e220c4-0009
        resources:
          requests:
            ephemeral-storage: "256Mi"
            memory: "256Mi"
            cpu: "200m"
          limits:
            ephemeral-storage: "1Gi"
            memory: "256Mi"
            cpu: "200m"
        # --- REGION: env
        env:
        - name: ASPNETCORE_URLS
          value: "https://+;http://+"
        - name: ASPNETCORE_HTTPS_PORT
          value: "443"
        # See https://yuruna.link/42f64340-0004
        - name: ASPNETCORE_Kestrel__Certificates__Default__Password
          valueFrom:
            secretKeyRef:
              name: {{ $certSecret }}
              key: password
        - name: ASPNETCORE_Kestrel__Certificates__Default__Path
          value: "/https/aspnetapp.pfx"
        # --- REGION: volumeMounts
        volumeMounts:
        - name: pod-certificate
          mountPath: /https
          readOnly: true
        # --- REGION: readinessProbe
        # See https://yuruna.link/42f64340-0005
        readinessProbe:
          httpGet:
            path: /
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        # --- REGION: livenessProbe
        # See https://yuruna.link/42f64340-0005
        livenessProbe:
          tcpSocket:
            port: 443
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
      # --- REGION: imagePullSecrets
      imagePullSecrets:
        - name: registry-credential
      # --- REGION: securityContext
      # See https://yuruna.link/42f64340-0004
      securityContext:
        fsGroup: 1654
      # --- REGION: volumes
      volumes:
      - name: pod-certificate
        secret:
          secretName: {{ $certSecret }}
          defaultMode: 0440
          items:
          - key: aspnetapp.pfx
            path: aspnetapp.pfx
---
# --- REGION: apiVersion
apiVersion: v1
kind: Service
# --- REGION: metadata
metadata:
  name: website
  namespace: {{ .Values.namespace }}
  labels:
    app: website
# --- REGION: spec
spec:
  type: NodePort
  # --- REGION: ports
  ports:
    - name: port80
      port: 80
      targetPort: 80
      protocol: TCP
    - name: port443
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: website
