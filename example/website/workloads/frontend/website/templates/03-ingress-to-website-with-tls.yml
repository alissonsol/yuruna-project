# reference: https://kubernetes.github.io/ingress-nginx/user-guide/basic-usage/
# --- REGION: apiVersion
apiVersion: networking.k8s.io/v1
kind: Ingress
# --- REGION: metadata
metadata:
  name: ingress-to-website
  namespace: {{ .Values.namespace }}
  labels:
    app: website
  # --- REGION: annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "true"
    # The HTTP smoke check requires 200 without following HTTPS redirects.
    # See https://yuruna.link/42f64340-0005
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
# --- REGION: spec
spec:
  ingressClassName: {{ required "ingressClass is required for the TLS ingress" .Values.ingressClass }}
  # --- REGION: tls
  tls:
  - hosts:
    - {{ required "websiteHost is required for the TLS ingress" .Values.websiteHost }}
    secretName: {{ required "websiteTlsSecret is required for the TLS ingress" .Values.websiteTlsSecret }}
  # --- REGION: rules
  rules:
  - host: {{ required "websiteHost is required for the TLS ingress" .Values.websiteHost }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: website
            port:
              number: 443
