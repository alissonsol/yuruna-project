# Workloads information - localhost
---
# --- REGION: globalVariables
globalVariables:
  # TO-SET: set domain below, like yrn42.com
  # websiteDomain:         "yrn42website-domain"
  websiteDomain:         "yrn42.com"
  # TO-SET: set site address below, like www.yrn42.com
  # websiteHost:           "www.yrn42website-domain"
  # see: https://letsencrypt.org/docs/certificates-for-localhost/
  websiteHost:           "localhost"
  websiteTlsSecret:      "website-tls-secret"
  # Secret holding the pod's HTTPS certificate and its generated password; created
  # by create-cert-secret.ps1 below and mounted by the chart.
  websitePodCertSecret:  "website-pod-cert"
  certManagerIssuerEmail: "certificates@yrn42.com"
  _registryLocation:     "$($([Environment]::GetEnvironmentVariable(\"${env:registryName}.registryLocation\")) -replace '[.]azurecr[.]io$','')"
  dockerServer:          "http://${env:_registryLocation}"
  dockerUsername:        "placeholder"
  dockerPassword:        "placeholder"
  ingressClass:          "nginx"

# --- REGION: workloads
workloads:
- context: "${env:runTag}-${env:project}-${env:runId}"
  variables:
    _hostname: "$([Environment]::GetEnvironmentVariable(\"${env:contextName}.hostname\"))"
    _frontendIp: "$([Environment]::GetEnvironmentVariable(\"${env:contextName}.frontendIp\"))"
    tls-crt: "$(Join-Path -Path ${env:workFolder} -ChildPath \"website-tls.crt\")"
    tls-key: "$(Join-Path -Path ${env:workFolder} -ChildPath \"website-tls.key\")"
  deployments:
    # Uninstall previous workloads: idempotent. Remove only what this
    # configuration installs, and give every namespace delete a deadline.
    # See https://yuruna.link/42e220c4-0012
    - kubectl: "delete namespace ${env:namespace} --ignore-not-found=true --timeout=300s --v=1"
    - kubectl: "delete namespace ingress-ns --ignore-not-found=true --timeout=300s --v=1"
    - kubectl: "delete clusterrole nginx-ingress-ingress-nginx --ignore-not-found=true"
    - kubectl: "delete clusterrolebinding nginx-ingress-ingress-nginx --ignore-not-found=true"
    # Install dependencies
    - kubectl: "create namespace ${env:namespace} --v=1"
    - kubectl: "config set-context --current --namespace=${env:namespace} --v=1"
    # Configure ingress certificate
    # On Linux, run mkcert -install as the logged-in user (honoring SUDO_USER)
    # so rootCA.pem lands in that user's $HOME/.local/share/mkcert.
    - shell: 'if ("$IsLinux" -eq "True") { sudo -u (`$(if (`$env:SUDO_USER) { `$env:SUDO_USER } else { `$env:USER })) -H mkcert -install } else { mkcert -install }'
    - shell: "mkcert -key-file \"${env:tls-key}\" -cert-file \"${env:tls-crt}\" ${env:websiteDomain} \"*.${env:websiteDomain}\" localhost \"*.localhost\" 127.0.0.1 ::1 ${env:_hostname} ${env:_frontendIp}"
    - kubectl: "delete secret ${env:websiteTlsSecret} --namespace=${env:namespace} --ignore-not-found=true"
    - kubectl: "create secret tls ${env:websiteTlsSecret} --key \"${env:tls-key}\" --cert \"${env:tls-crt}\" --namespace=${env:namespace}"
    # Ingress
    - helm: "repo add ingress-nginx https://kubernetes.github.io/ingress-nginx"
    - helm: "repo update"
    - helm: >
        install nginx-ingress ingress-nginx/ingress-nginx
        --namespace ingress-ns
        --create-namespace
        --set controller.replicaCount=1
        --set controller.nodeSelector."kubernetes\.io/os"=linux
        --set controller.hostPort.enabled=true
        --set controller.service.type=ClusterIP
        --set controller.admissionWebhooks.enabled=false
        --set controller.ingressClass=${env:ingressClass}
    # Install components
    - kubectl: "config set-context --current --namespace=${env:namespace} --v=1"
    - kubectl: "create secret docker-registry registry-credential --docker-server=${env:dockerServer} --docker-username=${env:dockerUsername} --docker-password=${env:dockerPassword}"
    # The pod needs this Secret to start, so it precedes the chart. The password is generated
    # inside the script and never passes through a variable, a command line or a log.
    - shell: "& '${env:project_root}/components/frontend/website/create-cert-secret.ps1' -Namespace ${env:namespace} -SecretName ${env:websitePodCertSecret}"
    - chart: "frontend/website"
      variables:
        installName: "website-${env:runId}"
    - shell: 'Write-Information ">> Endpoint: https://${env:websiteHost}"'
    - shell: 'Write-Information "-- Check containers started: kubectl get pods --all-namespaces"'
    - shell: 'Write-Information "-- Check services: kubectl get svc --all-namespaces"'
    - shell: 'Write-Information ">>    Test: curl -k -v http://${env:websiteHost}"'
    - shell: 'Write-Information ">>    Check usage of ports like 80 and 443 (Quit/starting Docker may resolve; not the menu item Restart!)"'
